name: Sync Upstream

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build firmware even if upstream is unchanged
        required: false
        type: boolean
        default: false
      promote_stable:
        description: Promote repeater-filter-stable (deliberate; never done by the weekly schedule)
        required: false
        type: boolean
        default: false
      stable_source:
        description: Branch to promote stable from (default repeater-filter)
        required: false
        type: string
        default: ""
      stable_skip_gate:
        description: Publish stable even if the native test gate fails (deliberate override)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: filter-sync
  cancel-in-progress: false

jobs:

  sync:
    name: Sync upstream and filter branches
    runs-on: ubuntu-latest
    outputs:
      dev_changed: ${{ steps.gate.outputs.dev_changed }}
      stable_changed: ${{ steps.gate.outputs.stable_changed }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward fork dev to upstream dev
        id: sync-dev
        run: |
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch upstream dev
          git checkout -B dev origin/dev
          if ! git merge --ff-only upstream/dev; then
            echo "fork/dev has diverged from upstream/dev; refusing to force-push." >&2
            exit 1
          fi
          git push origin dev

      - name: Fast-forward fork main to upstream main
        id: sync-main
        run: |
          git fetch upstream main
          git checkout -B main origin/main
          if ! git merge --ff-only upstream/main; then
            echo "fork/main has diverged from upstream/main; refusing to force-push." >&2
            exit 1
          fi
          git push origin main

      - name: Merge fork dev into repeater-filter
        id: merge
        run: |
          git checkout repeater-filter
          # --no-commit so the fork-owned README can be restored before the
          # merge commit is created
          # `|| true` here would hide a git error that is not a conflict (a
          # failed checkout, a bad object); only a real conflict is tolerated,
          # and it is reported below.
          MERGE_RC=0
          git merge origin/dev --no-commit --no-ff || MERGE_RC=$?
          # README.md is fork-owned: force it back to this branch's version no
          # matter what the merge did (clean take of upstream changes or conflict)
          git checkout HEAD -- README.md
          if [ "$MERGE_RC" != 0 ] && [ ! -f .git/MERGE_HEAD ]; then
            echo "git merge failed with status $MERGE_RC and left no merge in progress;" >&2
            echo "that is a git error, not an already-up-to-date merge" >&2
            exit 1
          fi
          if [ ! -f .git/MERGE_HEAD ]; then
            echo "Already up to date with dev"
            echo "merged=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U > conflicted-files.txt
            git merge --abort
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit --no-edit
          git push origin repeater-filter
          echo "merged=true" >> $GITHUB_OUTPUT

      - name: Open merge-conflict issue
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '[filter-sync-conflict]';
            const files = fs.readFileSync('conflicted-files.txt', 'utf8').trim() || '(none listed)';
            const body = [
              marker,
              'Automatic merge of `dev` into `repeater-filter` failed with conflicts.',
              '',
              '**Conflicted files:**',
              '',
              ...files.split('\n').map((f) => '- ' + f),
              '',
              'Resolve the conflicts locally, push the merge, then close this issue.',
            ].join('\n');
            const res = await github.rest.search.issuesAndPullRequests({
              q: 'repo:' + context.repo.owner + '/' + context.repo.repo + ' is:issue is:open "' + marker + '" in:body',
            });
            if (res.data.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: res.data.items[0].number,
                title: 'Upstream merge conflict in repeater-filter',
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream merge conflict in repeater-filter',
                body,
              });
            }

      - name: Promote repeater-filter-stable (explicit only)
        id: stable
        # Stable is NEVER promoted by the weekly schedule. Promoting means
        # publishing a feature series as "the stable release" users install, so
        # it is a deliberate act: dispatch this workflow with promote_stable.
        if: inputs.promote_stable == true
        env:
          STABLE_SOURCE: ${{ inputs.stable_source }}
          SKIP_GATE: ${{ inputs.stable_skip_gate }}
        run: |
          set -euo pipefail
          SOURCE="${STABLE_SOURCE:-repeater-filter}"
          if ! git rev-parse --verify "refs/remotes/origin/$SOURCE" >/dev/null; then
            echo "No such branch to promote from: $SOURCE" >&2
            exit 1
          fi
          STABLE_BEFORE=$(git rev-parse refs/remotes/origin/repeater-filter-stable)

          # Everything happens on a scratch branch. The real stable branch is
          # touched exactly once, at the end, and only if the whole series
          # applied AND the gate passed. A half-applied series is never published.
          STAGE="promote-$(git rev-parse --short HEAD)"
          git checkout -B "$STAGE" "$STABLE_BEFORE"

          # carry the upstream release branch. README.md is fork-owned and is
          # restored BEFORE the merge commit is created, so upstream's README
          # never lands in an intermediate commit just to be overwritten later.
          if ! git merge origin/main --no-commit --no-ff; then
            git diff --name-only --diff-filter=U > stable-conflicted-files.txt || true
            git checkout repeater-filter -- README.md
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git merge --abort || true
              echo "conflict=true" >> $GITHUB_OUTPUT
              echo "Upstream main did not merge into stable; stable is unchanged" >&2
              exit 1
            fi
          fi
          git checkout repeater-filter -- README.md
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi

          # cherry-pick the filter commits not yet on stable (git cherry matches
          # by patch-id, so already-picked commits are skipped); oldest first
          PICKS=$(git cherry HEAD "$SOURCE" origin/dev | grep '^+' | cut -d' ' -f2 || true)
          PICK_COUNT=0
          for c in $PICKS; do
            # skip fork-owned-README-only commits; the README is synced below
            if [ -z "$(git show --pretty=format: --name-only "$c" | grep -v '^README.md$')" ]; then
              continue
            fi
            if ! git cherry-pick "$c"; then
              git diff --name-only --diff-filter=U > stable-conflicted-files.txt || true
              git cherry-pick --abort
              echo "conflict=true" >> $GITHUB_OUTPUT
              # A stable conflict is a failure, not a warning. The previous
              # stable is still intact on the remote; nothing was pushed.
              echo "Cherry-pick of $c conflicted; stable is unchanged. Resolve and re-run." >&2
              exit 1
            fi
            PICK_COUNT=$((PICK_COUNT + 1))
          done

          # keep the fork-owned README in step with the source branch
          git checkout repeater-filter -- README.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync fork README"
          fi
          echo "picked=$PICK_COUNT" >> $GITHUB_OUTPUT

          # ---- quality gate: never publish something that does not pass ----
          if [ "$SKIP_GATE" != true ]; then
            if [ -z "${PIO:-}" ] && ! command -v pio >/dev/null 2>&1; then
              echo "pio is not available; cannot run the gate (or set stable_skip_gate)" >&2
              exit 1
            fi
            pio test -e native -e native_kiss_modem -e native_packet_filter -e native_battery_gate
          else
            echo "stable_skip_gate set: publishing without the native test gate" >&2
          fi

          # ---- publish: once, and never force ----
          # An ordinary non-fast-forward rejection is the correct outcome if
          # something else moved stable while this ran.
          git checkout -B repeater-filter-stable
          git reset --hard "$STAGE"
          git push origin repeater-filter-stable
          STABLE_AFTER=$(git ls-remote origin refs/heads/repeater-filter-stable | cut -f1)
          if [ "$STABLE_BEFORE" != "$STABLE_AFTER" ]; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Open stable-sync conflict issue
        if: steps.stable.outputs.conflict == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '[filter-sync-conflict-stable]';
            const files = fs.readFileSync('stable-conflicted-files.txt', 'utf8').trim() || '(none listed)';
            const body = [
              marker,
              'Promoting `repeater-filter-stable` (merge of `main` and/or cherry-picks from `repeater-filter`) failed with conflicts. Stable was not changed.',
              '',
              '**Conflicted files:**',
              '',
              ...files.split('\n').map((f) => '- ' + f),
              '',
              'Resolve the conflicts locally, push the branch, then close this issue.',
            ].join('\n');
            const res = await github.rest.search.issuesAndPullRequests({
              q: 'repo:' + context.repo.owner + '/' + context.repo.repo + ' is:issue is:open "' + marker + '" in:body',
            });
            if (res.data.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: res.data.items[0].number,
                title: 'Upstream sync conflict in repeater-filter-stable',
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream sync conflict in repeater-filter-stable',
                body,
              });
            }

      - name: Set build gate
        id: gate
        if: always()
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
          STABLE_PUSHED: ${{ steps.stable.outputs.pushed }}
        run: |
          # dev is built when the integration branch moved; stable only when it
          # was promoted. Building the channel that did not move would re-tag a
          # release for no reason.
          DEV=false
          STABLE=false
          if [ "$MERGED" = "true" ]; then DEV=true; fi
          if [ "$STABLE_PUSHED" = "true" ]; then STABLE=true; fi
          echo "dev_changed=$DEV" >> $GITHUB_OUTPUT
          echo "stable_changed=$STABLE" >> $GITHUB_OUTPUT

      - name: Fail on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Fail on stable promotion conflict
        # a stable conflict is a failure like any other, not a warning
        if: steps.stable.outputs.conflict == 'true'
        run: exit 1

  build-dev:
    name: Build firmware (dev)
    needs: sync
    if: needs.sync.outputs.dev_changed == 'true' || inputs.force_build == true
    uses: ./.github/workflows/filter-build.yml
    with:
      channel: dev
      branch: repeater-filter
      force_build: ${{ inputs.force_build == true }}

  build-stable:
    name: Build firmware (stable)
    needs: sync
    # stable is built only when it was deliberately promoted
    if: needs.sync.outputs.stable_changed == 'true'
    uses: ./.github/workflows/filter-build.yml
    with:
      channel: stable
      branch: repeater-filter-stable
      force_build: ${{ inputs.force_build == true }}
