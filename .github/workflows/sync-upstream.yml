name: Sync Upstream

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build firmware even if upstream is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: filter-sync
  cancel-in-progress: false

jobs:

  sync:
    name: Sync upstream and filter branches
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward fork dev to upstream dev
        id: sync-dev
        run: |
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch upstream dev
          git checkout -B dev origin/dev
          if ! git merge --ff-only upstream/dev; then
            echo "fork/dev has diverged from upstream/dev; refusing to force-push." >&2
            exit 1
          fi
          git push origin dev

      - name: Fast-forward fork main to upstream main
        id: sync-main
        run: |
          git fetch upstream main
          git checkout -B main origin/main
          if ! git merge --ff-only upstream/main; then
            echo "fork/main has diverged from upstream/main; refusing to force-push." >&2
            exit 1
          fi
          git push origin main

      - name: Merge fork dev into repeater-filter
        id: merge
        run: |
          git checkout repeater-filter
          # --no-commit so the fork-owned README can be restored before the
          # merge commit is created
          git merge origin/dev --no-commit --no-ff || true
          # README.md is fork-owned: force it back to this branch's version no
          # matter what the merge did (clean take of upstream changes or conflict)
          git checkout HEAD -- README.md
          if [ ! -f .git/MERGE_HEAD ]; then
            echo "Already up to date with dev"
            echo "merged=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U > conflicted-files.txt
            git merge --abort
            echo "merged=false" >> $GITHUB_OUTPUT
            echo "conflict=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit --no-edit
          git push origin repeater-filter
          echo "merged=true" >> $GITHUB_OUTPUT

      - name: Open merge-conflict issue
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '[filter-sync-conflict]';
            const files = fs.readFileSync('conflicted-files.txt', 'utf8').trim() || '(none listed)';
            const body = [
              marker,
              'Automatic merge of `dev` into `repeater-filter` failed with conflicts.',
              '',
              '**Conflicted files:**',
              '',
              ...files.split('\n').map((f) => '- ' + f),
              '',
              'Resolve the conflicts locally, push the merge, then close this issue.',
            ].join('\n');
            const res = await github.rest.search.issuesAndPullRequests({
              q: 'repo:' + context.repo.owner + '/' + context.repo.repo + ' is:issue is:open "' + marker + '" in:body',
            });
            if (res.data.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: res.data.items[0].number,
                title: 'Upstream merge conflict in repeater-filter',
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream merge conflict in repeater-filter',
                body,
              });
            }

      - name: Maintain repeater-filter-stable
        id: stable
        run: |
          git checkout repeater-filter-stable || git checkout -b repeater-filter-stable origin/main
          # carry the upstream release branch (merge commit when main moved;
          # repeater-filter-stable always diverges from main by the filter picks)
          # --no-commit so the fork-owned README can be resolved before the
          # merge commit is created
          git merge origin/main --no-commit --no-ff || true
          if [ -f .git/MERGE_HEAD ] && [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            # README.md is fork-owned; resolve it as the repeater-filter version
            # so it can never block the merge. Abort only for other files.
            git checkout repeater-filter -- README.md
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              git diff --name-only --diff-filter=U > stable-conflicted-files.txt
              git merge --abort
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          fi
          # cherry-pick filter commits not yet on stable (git cherry matches by
          # patch-id, so already-picked commits are skipped); oldest first
          PICKS=$(git cherry HEAD repeater-filter origin/dev | grep '^+' | cut -d' ' -f2)
          for c in $PICKS; do
            # skip fork-owned-README-only commits; the README is synced below
            if [ -z "$(git show --pretty=format: --name-only "$c" | grep -v '^README.md$')" ]; then
              continue
            fi
            if ! git cherry-pick "$c"; then
              git diff --name-only --diff-filter=U > stable-conflicted-files.txt || true
              git cherry-pick --abort
              echo "conflict=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          # keep the fork-owned README in step with repeater-filter
          git checkout repeater-filter -- README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync fork README"
          fi
          git push origin repeater-filter-stable

      - name: Open stable-sync conflict issue
        if: steps.stable.outputs.conflict == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '[filter-sync-conflict-stable]';
            const files = fs.readFileSync('stable-conflicted-files.txt', 'utf8').trim() || '(none listed)';
            const body = [
              marker,
              'Automatic update of `repeater-filter-stable` (merge of `main` and/or cherry-picks from `repeater-filter`) failed with conflicts.',
              '',
              '**Conflicted files:**',
              '',
              ...files.split('\n').map((f) => '- ' + f),
              '',
              'Resolve the conflicts locally, push the branch, then close this issue.',
            ].join('\n');
            const res = await github.rest.search.issuesAndPullRequests({
              q: 'repo:' + context.repo.owner + '/' + context.repo.repo + ' is:issue is:open "' + marker + '" in:body',
            });
            if (res.data.total_count > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: res.data.items[0].number,
                title: 'Upstream sync conflict in repeater-filter-stable',
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream sync conflict in repeater-filter-stable',
                body,
              });
            }

      - name: Fail on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

  build:
    name: Build firmware (${{ matrix.channel }})
    needs: sync
    strategy:
      matrix:
        include:
          - channel: dev
            branch: repeater-filter
          - channel: stable
            branch: repeater-filter-stable
    uses: ./.github/workflows/filter-build.yml
    with:
      channel: ${{ matrix.channel }}
      branch: ${{ matrix.branch }}
      force_build: ${{ inputs.force_build }}
