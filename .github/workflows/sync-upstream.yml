name: Sync Upstream

# manual only: the fork's Actions usage got shut down once, and a schedule is
# not worth the surprise — run it deliberately, from the Actions UI or
# `gh workflow run sync-upstream.yml -f channel=dev`
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to sync (dev = repeater-filter, stable = repeater-filter-stable)
        required: true
        type: choice
        default: dev
        options:
          - dev
          - stable

permissions:
  contents: write
  issues: write

concurrency:
  group: filter-sync
  cancel-in-progress: false

jobs:

  sync:
    name: Merge upstream into the channel branch
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream into the channel branch
        id: merge
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const { spawnSync } = require('child_process');
            const fs = require('fs');
            const git = (...args) => spawnSync('git', args, { encoding: 'utf8' });
            const run = (...args) => {
              const r = git(...args);
              if (r.status !== 0) throw new Error(`git ${args.join(' ')} failed: ${(r.stderr || '').trim()}`);
              return r.stdout;
            };

            const channel = process.env.CHANNEL;
            if (channel !== 'dev' && channel !== 'stable') {
              core.setFailed("channel must be 'dev' or 'stable'");
              return;
            }
            // the channel's upstream source and the fork branch it feeds
            const upstreamBranch = channel === 'dev' ? 'dev' : 'main';
            const target = channel === 'dev' ? 'repeater-filter' : 'repeater-filter-stable';

            run('remote', 'add', 'upstream', 'https://github.com/meshcore-dev/MeshCore.git');

            // keep the fork's pristine mirror of the upstream branch a true
            // fast-forward, so origin/<upstreamBranch> stays an honest upstream
            // pointer (the promotion's cherry base and the release version job
            // both read it)
            run('fetch', 'upstream', upstreamBranch);
            run('checkout', '-B', upstreamBranch, `origin/${upstreamBranch}`);
            const merge = git('merge', '--ff-only', `upstream/${upstreamBranch}`);
            if (merge.status !== 0) {
              core.setFailed(`fork/${upstreamBranch} has diverged from upstream/${upstreamBranch}; refusing to force-push.`);
              return;
            }
            run('push', 'origin', upstreamBranch);

            // --no-commit so the fork-owned README can be restored before the
            // merge commit is created
            run('checkout', target);
            // the status is inspected, not just thrown: only a real conflict is
            // tolerated, any other git failure is reported below
            const branchMerge = git('merge', `origin/${upstreamBranch}`, '--no-commit', '--no-ff');
            if (branchMerge.error) throw branchMerge.error;
            // README.md is fork-owned: force it back to this branch's version no
            // matter what the merge did (clean take of upstream changes or conflict)
            run('checkout', 'HEAD', '--', 'README.md');
            if (branchMerge.status !== 0 && !fs.existsSync('.git/MERGE_HEAD')) {
              core.setFailed(`git merge failed with status ${branchMerge.status} and left no merge in progress; that is a git error, not an already-up-to-date merge`);
              return;
            }
            if (!fs.existsSync('.git/MERGE_HEAD')) {
              core.info(`Already up to date with ${upstreamBranch}`);
              core.setOutput('merged', 'false');
              return;
            }
            const unmerged = git('diff', '--name-only', '--diff-filter=U').stdout.trim();
            if (unmerged) {
              fs.writeFileSync('conflicted-files.txt', unmerged + '\n');
              run('merge', '--abort');
              core.setOutput('merged', 'false');
              core.setOutput('conflict', 'true');
              return;
            }
            run('commit', '--no-edit');
            run('push', 'origin', target);
            core.setOutput('merged', 'true');

      - name: Open merge-conflict issue
        if: steps.merge.outputs.conflict == 'true'
        uses: ./.github/actions/open-conflict-issue
        with:
          marker: ${{ inputs.channel == 'stable' && '[filter-sync-conflict-stable]' || '[filter-sync-conflict]' }}
          files-file: conflicted-files.txt
          title: ${{ inputs.channel == 'stable' && 'Upstream sync conflict in repeater-filter-stable' || 'Upstream merge conflict in repeater-filter' }}
          intro: ${{ inputs.channel == 'stable' && 'Automatic merge of `main` into `repeater-filter-stable` failed with conflicts.' || 'Automatic merge of `dev` into `repeater-filter` failed with conflicts.' }}
          closing: 'Resolve the conflicts locally, push the merge, then close this issue.'
          failure-message: ${{ inputs.channel == 'stable' && 'Upstream sync conflict in repeater-filter-stable; resolve locally, push the merge, then close this issue.' || 'Upstream merge conflict in repeater-filter; resolve locally, push the merge, then close this issue.' }}
