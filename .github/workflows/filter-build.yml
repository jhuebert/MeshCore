name: Filter Firmware Build

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: string
        default: dev
      targets:
        description: Comma- or newline-separated build targets (defaults to the FIRMWARE_TARGETS repo variable)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: choice
        default: dev
        options:
          - dev
          - stable
      targets:
        description: Comma- or newline-separated build targets (defaults to the FIRMWARE_TARGETS repo variable)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: filter-build-${{ inputs.channel }}
  cancel-in-progress: false

jobs:

  version:
    name: Derive version, tag and gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      branch: ${{ steps.version.outputs.branch }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      changes_section: ${{ steps.version.outputs.changes_section }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # empty branch input = the channel's own branch
          # the ref is an expression evaluated by Actions, never shell text
          ref: ${{ inputs.branch != '' && inputs.branch || (inputs.channel == 'stable' && 'repeater-filter-stable' || 'repeater-filter') }}
          fetch-depth: 0

      - name: Derive Version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_BUILD: ${{ inputs.force_build }}
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            dev|stable) ;;
            *) echo "channel must be 'dev' or 'stable'" >&2; exit 1 ;;
          esac

          if [ "$CHANNEL" = stable ]; then
            BRANCH="repeater-filter-stable"
            BASE_REF="origin/main"
          else
            BRANCH="repeater-filter"
            BASE_REF="origin/dev"
          fi
          # via env, not an Actions expression: input text must never become
          # shell syntax
          if [ -n "$BRANCH_INPUT" ]; then BRANCH="$BRANCH_INPUT"; fi
          # recorded so the release can name the exact revision it came from
          SHORT_SHA=$(git rev-parse --short HEAD)

          # upstream base: last companion-v* tag reachable from HEAD, X.Y.Z only
          # (companion-v1.17.1-25-g6df98abe -> v1.17.1)
          DESC=$(git describe --tags --match 'companion-v*' HEAD 2>/dev/null || true)
          if [ -n "$DESC" ]; then
            UPSTREAM_VERSION="${DESC#companion-}"
            UPSTREAM_VERSION="${UPSTREAM_VERSION%%-*}"
          else
            UPSTREAM_VERSION="untagged"
          fi

          if [ "$CHANNEL" = stable ]; then
            # previous stable tag = latest filter-v* tag under the new scheme
            # (no -dev suffix, no old date-scheme tags)
            PREV_TAG=$(git tag --list 'filter-v*' \
              | grep -v -- '-dev\.' | grep -vE -- '-20[0-9]{6}-' \
              | sort -V | tail -1 || true)
            # tag: filter-v<base>, or -rN when that base was already released
            RN_SUFFIX=""
            if git rev-parse -q --verify "refs/tags/filter-${UPSTREAM_VERSION}" >/dev/null; then
              N=1
              while git rev-parse -q --verify "refs/tags/filter-${UPSTREAM_VERSION}-r${N}" >/dev/null; do
                N=$((N + 1))
              done
              RN_SUFFIX="-r${N}"
            fi
            RELEASE_TAG="filter-${UPSTREAM_VERSION}${RN_SUFFIX}"
            DISPLAY_VERSION="${UPSTREAM_VERSION}${RN_SUFFIX}"
            RELEASE_TITLE="Filter Firmware ${DISPLAY_VERSION} (stable)"
            # build.sh appends -<short sha> itself
            FIRMWARE_VERSION="${UPSTREAM_VERSION}-filter"
          else
            # previous dev tag = latest filter-*-dev.* tag (new scheme only).
            # Scoped to the channel's own tags, so an unrelated stable release
            # cannot mask a dev change (or vice versa).
            PREV_TAG=$(git tag --list 'filter-*-dev.*' \
                       | sort -V | tail -1 || true)
            # counter = highest existing suffix for this base + 1. Counting the
            # tags (count + 1) collides when one was deleted or a gap exists,
            # and a duplicate tag fails the release.
            MAXN=$(git tag --list "filter-${UPSTREAM_VERSION}-dev.*" \
                   | sed -n 's/.*\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1 || true)
            N=$(( ${MAXN:-0} + 1 ))
            RELEASE_TAG="filter-${UPSTREAM_VERSION}-dev.${N}"
            DISPLAY_VERSION="${UPSTREAM_VERSION}-dev.${N}"
            RELEASE_TITLE="Filter Firmware ${DISPLAY_VERSION}"
            # build.sh appends -<short sha> itself
            FIRMWARE_VERSION="${UPSTREAM_VERSION}-dev.${N}-filter"
          fi

          # ---- gate: should this channel build at all? ----
          SKIP=true
          RANGE="HEAD"
          if [ "$FORCE_BUILD" = true ]; then
            SKIP=false
            # forced builds still list changes since the previous release,
            # when there is one to compare against
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            fi
          elif [ -z "$PREV_TAG" ]; then
            # first release of this channel under the new scheme
            SKIP=false
            RANGE="HEAD"
          else
            # upstream base changed -> build to carry the new base
            PREV_BASE=$(echo "$PREV_TAG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "$PREV_BASE" ] && [ "$PREV_BASE" != "$UPSTREAM_VERSION" ]; then
              SKIP=false
            fi
            RANGE="${PREV_TAG}..HEAD"
          fi

          if [ "$SKIP" = true ]; then
            # build when any commit since the channel's last release touches
            # code (dev channel counts upstream commits too; stable excludes
            # upstream history so only cherry-picked filter commits count)
            # merges INCLUDED: a merge commit can carry a hand-resolved conflict,
            # which is a real code change that --no-merges would hide
            if [ "$CHANNEL" = stable ]; then
              COMMITS=$(git rev-list "$RANGE" --not "$BASE_REF")
            else
              COMMITS=$(git rev-list "$RANGE")
            fi
            for c in $COMMITS; do
              CODE=0
              while IFS= read -r p; do
                case "$p" in
                  *.md|docs/*) ;;                       # docs only
                  .github/actions/*) CODE=1; break ;;   # build env = code
                  .github/*) ;;                         # CI only
                  *) CODE=1; break ;;
                esac
              done < <(git diff-tree --no-commit-id --name-only -r "$c")
              if [ "$CODE" = 1 ]; then
                SKIP=false
                break
              fi
            done
          fi

          # ---- curated "Filter changes in this build" section ----
          # filter-only commits since the previous release of this channel
          # (--not <upstream base> subtracts everything reachable from upstream)
          CHANGES_FILE=$(mktemp)
          for c in $(git rev-list "$RANGE" --not "$BASE_REF"); do
            SUBJECT=$(git log -1 --format=%s "$c")
            DOCS_ONLY=1
            while IFS= read -r p; do
              case "$p" in
                *.md|docs/*|.github/*) ;;
                *) DOCS_ONLY=0; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$c")
            if [ "$DOCS_ONLY" = 1 ]; then
              echo "- $SUBJECT" >> "${CHANGES_FILE}.extra"
            else
              case "$SUBJECT" in
                test:*|test\(*) echo "- $SUBJECT" >> "${CHANGES_FILE}.extra" ;;
                *) echo "- $SUBJECT" >> "${CHANGES_FILE}.main" ;;
              esac
            fi
          done

          if [ -s "${CHANGES_FILE}.main" ] || [ -s "${CHANGES_FILE}.extra" ]; then
            {
              echo "## Filter changes in this build"
              echo
              cat "${CHANGES_FILE}.main" 2>/dev/null || true
              if [ -s "${CHANGES_FILE}.extra" ]; then
                echo "<details><summary>Tests, docs & CI</summary>"
                echo
                cat "${CHANGES_FILE}.extra"
                echo
                echo "</details>"
              fi
            } > "$CHANGES_FILE"
          else
            : > "$CHANGES_FILE"
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "firmware_version=$FIRMWARE_VERSION" >> "$GITHUB_OUTPUT"
          # the exact revision everything below was derived from and built at
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            # generated delimiter: a commit subject containing a fixed
            # CHANGES_EOF line would truncate the output block
            DELIM="CHANGES_EOF_$(git rev-parse --short HEAD)_RANDOM"
            while grep -qF "$DELIM" "$CHANGES_FILE" 2>/dev/null; do
              DELIM="${DELIM}X"
            done
            echo "changes_section<<$DELIM"
            cat "$CHANGES_FILE"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  validate-targets:
    name: Validate build targets
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.validate.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # the revision the release names, not the branch tip: the target list
          # must describe the same tree the firmware is built from
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Validate Build Targets
        id: validate
        env:
          TARGETS_INPUT: ${{ inputs.targets }}
          FIRMWARE_TARGETS: ${{ vars.FIRMWARE_TARGETS }}
        run: |
          # resolve targets: explicit input, else FIRMWARE_TARGETS repo variable
          # (both via env: an input containing a quote must stay data)
          TARGETS="${TARGETS_INPUT:-$FIRMWARE_TARGETS}"
          if [ -z "$TARGETS" ]; then
            echo "No targets: set the FIRMWARE_TARGETS repo variable or pass the 'targets' input" >&2
            exit 1
          fi

          # known targets come from platformio.ini via build.sh
          # build.sh uses bash arrays; /bin/sh is not a contract
          bash build.sh list > /tmp/known-targets.txt

          # warn and skip unknown names instead of failing: a target can be
          # valid on the dev branch but not yet on stable's upstream base
          VALID_TARGETS=""
          for target in $(echo "$TARGETS" | tr -d '\r' | tr ' ,' '\n'); do
            [ -z "$target" ] && continue
            if grep -qx "$target" /tmp/known-targets.txt; then
              VALID_TARGETS="$VALID_TARGETS $target"
            else
              echo "Warning: unknown build target '$target' - skipped (not in this branch's platformio.ini)" >&2
            fi
          done
          if [ -z "${VALID_TARGETS// }" ]; then
            echo "No known build targets: every entry in the target list is unknown to this branch" >&2
            exit 1
          fi

          # convert targets separated by spaces into a json array string
          JSON_ARRAY=$(echo "$VALID_TARGETS" | tr ' ' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: [version, validate-targets]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Dev publishes what built, and every omission is visible in the per-target
    # manifests shipped with the release. Stable does NOT: a stable release is
    # what users install, so any requested board failing must block it.
    continue-on-error: ${{ inputs.channel != 'stable' }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.validate-targets.outputs.targets) }}
      fail-fast: false
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # pinned, like the target list: if the branch moved after version
          # selection, the manifest, the release body and the tag would all name
          # a revision this job never built
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Clear stale artifacts
        # a previous run's output must never be mistaken for this run's
        run: rm -rf out

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ needs.version.outputs.firmware_version }}
          TARGET: ${{ matrix.target }}
          # metadata-only (emits .su files next to the objects; codegen is
          # unchanged) — consumed by the stack usage check below
          PLATFORMIO_BUILD_FLAGS: -fstack-usage
        run: /usr/bin/env bash build.sh build-firmware "$TARGET"

      - name: Stack usage check
        # One big stack scratch array in boot- or loop-path code brick-reboots
        # every repeater flashed with the release (2026-10: an 8.5 KB scratch
        # in FilterRules::load overflowed the 4 KB nRF52 / 8 KB ESP32 loop
        # task stacks at boot). The compiler's own accounting catches that
        # class on every target we publish; the binary is unaffected.
        env:
          TARGET: ${{ matrix.target }}
          STACK_FRAME_LIMIT: 2048
        run: |
          set -euo pipefail
          SU_DIR=".pio/build/$TARGET"
          # repo code only: src/ and examples/. Vendored crypto (lib/ed25519) and
          # libdeps libraries carry frames above the limit that ship today and are
          # not what this repo edits; gating them would train everyone to ignore
          # the check. The frames this repo owns are the ones it can break.
          mapfile -t SU_FILES < <(find "$SU_DIR/src" "$SU_DIR/examples" -name '*.su' 2>/dev/null)
          if [ "${#SU_FILES[@]}" -eq 0 ]; then
            echo "ERROR: no .su files under $SU_DIR — the build did not run with -fstack-usage, check is blind" >&2
            exit 1
          fi
          OFFENDERS=$(LC_ALL=C sort -t$'\t' -k2,2 -rn "${SU_FILES[@]}" \
            | awk -F'\t' -v limit="$STACK_FRAME_LIMIT" '$2+0 >= limit { print $2 " B  " $1 }')
          if [ -n "$OFFENDERS" ]; then
            echo "ERROR: stack frames >= ${STACK_FRAME_LIMIT} B (loop task is 4 KB on nRF52, 8 KB on ESP32):" >&2
            echo "$OFFENDERS" >&2
            exit 1
          fi
          echo "OK: $(echo "${SU_FILES[@]" | wc -w}) translation units, no stack frame >= ${STACK_FRAME_LIMIT} B"

      - name: Write build manifest
        # a per-target record of what was actually produced (after the stack
        # usage check passed), so a release can never imply coverage it does not have
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # built outside out/ so the glob below cannot see the manifest itself:
          # the redirect would create it before the listing ran, and it would
          # record its own (still-being-written) sha256
          {
            echo "target: $TARGET"
            echo "source_sha: $SOURCE_SHA"
            echo "channel: $CHANNEL"
            echo "status: built"
            echo "artifacts:"
            for f in out/*; do
              [ -f "$f" ] || continue
              echo "  - $(basename "$f")  sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > manifest-$TARGET.txt
          mv manifest-$TARGET.txt "out/manifest-$TARGET.txt"
          cat "out/manifest-$TARGET.txt"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          # channel prefix keeps the two concurrently-built channels' artifacts
          # from colliding in the shared artifact store
          name: "firmware-${{ inputs.channel }}-${{ matrix.target }}"
          path: out
          if-no-files-found: error

  release:
    name: Create Release
    needs: [version, validate-targets, build]
    if: inputs.create_release && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # only this job writes; build and test jobs stay at contents: read
    permissions:
      contents: write
    steps:

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "firmware-${{ inputs.channel }}-*"
          merge-multiple: true
          path: out

      - name: Move manifests out of the release assets
        # the manifests describe the release; they are not part of it
        run: |
          set -euo pipefail
          mkdir -p .manifests
          mv out/manifest-*.txt .manifests/ 2>/dev/null || true

      - name: Summarise what actually built
        id: manifest
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # Every build writes a manifest naming its target, the source SHA and
          # the files it produced. Collecting them here means a dev release that
          # published only some boards says so, loudly, instead of implying the
          # whole list was covered. They are read from where the previous step
          # moved them: the asset directory no longer holds them.
          SUMMARY=""
          COUNT=0
          for m in .manifests/manifest-*.txt; do
            [ -f "$m" ] || continue
            COUNT=$((COUNT + 1))
            TARGET=$(sed -n 's/^target: //p' "$m")
            SUMMARY="${SUMMARY}- \`${TARGET}\`\n"
          done
          if [ "$COUNT" = 0 ]; then
            BODY="_No build manifests were produced._"
          else
            # %b, not the bare format: SUMMARY starts with "-", which printf
            # would otherwise read as an option and refuse. The header joins the
            # same expansion, so the list below it is real newlines rather than
            # literal "\n" text on the heading line.
            BODY="### Boards in this release$(printf '\n\n%b' "$SUMMARY")"
          fi
          {
            echo "summary<<MANIFEST_EOF"
            echo "$BODY"
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_title }}
          # dev releases are pre-releases; the stable release is the repo's latest
          prerelease: ${{ inputs.channel != 'stable' }}
          make_latest: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
          generate_release_notes: true
          body: |
            Built from commit `${{ needs.version.outputs.source_sha }}`.

            ${{ needs.version.outputs.changes_section }}

            ${{ steps.manifest.outputs.summary }}
          files: out/*
          target_commitish: ${{ needs.version.outputs.source_sha }}
