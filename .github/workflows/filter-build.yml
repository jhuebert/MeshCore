name: Filter Release

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: string
        default: dev
      branch:
        description: Branch to release (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      force_build:
        description: Create the release even if nothing changed since the last one of this channel
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: choice
        default: dev
        options:
          - dev
          - stable
      branch:
        description: Branch to release (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      force_build:
        description: Create the release even if nothing changed since the last one of this channel
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: filter-build-${{ inputs.channel }}
  cancel-in-progress: false

jobs:

  version:
    name: Derive version, tag and gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      branch: ${{ steps.version.outputs.branch }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # empty branch input = the channel's own branch
          # the ref is an expression evaluated by Actions, never shell text
          ref: ${{ inputs.branch != '' && inputs.branch || (inputs.channel == 'stable' && 'repeater-filter-stable' || 'repeater-filter') }}
          fetch-depth: 0

      - name: Derive Version
        id: version
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_BUILD: ${{ inputs.force_build }}
          BRANCH_INPUT: ${{ inputs.branch }}
        with:
          script: |
            const { spawnSync } = require('child_process');
            const git = (...args) => {
              const r = spawnSync('git', args, { encoding: 'utf8' });
              if (r.status !== 0) throw new Error(`git ${args.join(' ')} failed: ${(r.stderr || '').trim()}`);
              return r.stdout;
            };
            const gitOk = (...args) => spawnSync('git', args, { encoding: 'utf8' }).status === 0;

            // version ordering comes from git itself (--sort=-v:refname):
            // r5 > r4, dev.16 > dev.9, base versions compare numerically
            const tags = (pattern) => git('tag', '--list', pattern, '--sort=-v:refname')
              .split('\n').map((s) => s.trim()).filter(Boolean);

            const channel = process.env.CHANNEL;
            if (channel !== 'dev' && channel !== 'stable') {
              core.setFailed("channel must be 'dev' or 'stable'");
              return;
            }

            let branch = 'repeater-filter';
            let baseRef = 'origin/dev';
            if (channel === 'stable') {
              branch = 'repeater-filter-stable';
              baseRef = 'origin/main';
            }
            // via env, not an Actions expression: input text must never become
            // shell syntax
            if (process.env.BRANCH_INPUT) branch = process.env.BRANCH_INPUT;

            // upstream base: last companion-v* tag reachable from HEAD, X.Y.Z only
            // (companion-v1.17.1-25-g6df98abe -> v1.17.1)
            const desc = spawnSync('git', ['describe', '--tags', '--match', 'companion-v*', 'HEAD'],
              { encoding: 'utf8' });
            let upstreamVersion = 'untagged';
            if (desc.status === 0 && desc.stdout.trim()) {
              upstreamVersion = desc.stdout.trim().replace(/^companion-/, '').split('-')[0];
            }

            let releaseTag, displayVersion, releaseTitle, firmwareVersion, prevTag;
            if (channel === 'stable') {
              // previous stable tag = latest filter-v* tag under the new scheme,
              // skipping dev-suffixed and old date-scheme tags
              prevTag = tags('filter-v*')
                .find((t) => !t.includes('-dev.') && !/-20\d{6}-/.test(t)) || '';
              // tag: filter-v<base>, or -rN when that base was already released
              let rnSuffix = '';
              if (gitOk('rev-parse', '-q', '--verify', `refs/tags/filter-${upstreamVersion}`)) {
                let n = 1;
                while (gitOk('rev-parse', '-q', '--verify', `refs/tags/filter-${upstreamVersion}-r${n}`)) n += 1;
                rnSuffix = `-r${n}`;
              }
              releaseTag = `filter-${upstreamVersion}${rnSuffix}`;
              displayVersion = `${upstreamVersion}${rnSuffix}`;
              releaseTitle = `Filter Firmware ${displayVersion} (stable)`;
              // build.sh appends -<short sha> itself
              firmwareVersion = `${upstreamVersion}-filter`;
            } else {
              // previous dev tag = latest filter-*-dev.* tag (new scheme only).
              // Scoped to the channel's own tags, so an unrelated stable release
              // cannot mask a dev change (or vice versa).
              prevTag = tags('filter-*-dev.*')[0] || '';
              // counter = highest existing suffix for this base + 1: the first
              // sorted tag carries it. Counting the tags (count + 1) collides
              // when one was deleted or a gap exists, and a duplicate tag fails
              // the release.
              const highestDev = tags(`filter-${upstreamVersion}-dev.*`)[0] || '';
              const m = highestDev.match(/\.(\d+)$/);
              const n = (m ? parseInt(m[1], 10) : 0) + 1;
              releaseTag = `filter-${upstreamVersion}-dev.${n}`;
              displayVersion = `${upstreamVersion}-dev.${n}`;
              releaseTitle = `Filter Firmware ${displayVersion}`;
              // build.sh appends -<short sha> itself
              firmwareVersion = `${upstreamVersion}-dev.${n}-filter`;
            }

            // ---- gate: should this channel build at all? ----
            let skip = true;
            let range = 'HEAD';
            if (process.env.FORCE_BUILD === 'true') {
              skip = false;
              // forced builds still list changes since the previous release,
              // when there is one to compare against
              if (prevTag) range = `${prevTag}..HEAD`;
            } else if (!prevTag) {
              // first release of this channel under the new scheme
              range = 'HEAD';
            } else {
              // upstream base changed -> build to carry the new base
              const prevBase = (prevTag.match(/v\d+\.\d+\.\d+/) || [])[0] || '';
              if (prevBase && prevBase !== upstreamVersion) skip = false;
              range = `${prevTag}..HEAD`;
            }

            if (skip) {
              // build when any commit since the channel's last release touches
              // code (dev channel counts upstream commits too; stable excludes
              // upstream history so only cherry-picked filter commits count)
              // merges INCLUDED: a merge commit can carry a hand-resolved conflict,
              // which is a real code change that --no-merges would hide
              const revListArgs = ['rev-list', range];
              if (channel === 'stable') revListArgs.push('--not', baseRef);
              const commits = git(...revListArgs).split('\n').filter(Boolean);
              for (const c of commits) {
                const isCode = git('diff-tree', '--no-commit-id', '--name-only', '-r', c)
                  .split('\n').filter(Boolean)
                  .some((p) => {
                    if (p.endsWith('.md') || p.startsWith('docs/')) return false;  // docs only
                    if (p.startsWith('.github/actions/')) return true;             // build env = code
                    if (p.startsWith('.github/')) return false;                    // CI only
                    return true;
                  });
                if (isCode) {
                  skip = false;
                  break;
                }
              }
            }

            core.setOutput('skip', String(skip));
            core.setOutput('branch', branch);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('release_title', releaseTitle);
            core.setOutput('firmware_version', firmwareVersion);
            // the exact revision everything below was derived from and built at
            core.setOutput('source_sha', git('rev-parse', 'HEAD').trim());

  release:
    name: Create Release
    needs: [version]
    runs-on: ubuntu-latest
    # only this job writes; the version job stays at contents: read
    permissions:
      contents: write
    steps:

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_title }}
          # dev releases are pre-releases; the stable release is the repo's latest
          prerelease: ${{ inputs.channel != 'stable' }}
          make_latest: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
          # release notes are written by hand after the release is created
          # firmware assets are built and uploaded locally (scripts/local-release-build.sh)
          body: "Built from commit `${{ needs.version.outputs.source_sha }}`."
          target_commitish: ${{ needs.version.outputs.source_sha }}
