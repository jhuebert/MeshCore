name: Filter Firmware Build

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: string
        default: dev
      targets:
        description: Comma- or newline-separated build targets (defaults to every repeater target this branch defines)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: choice
        default: dev
        options:
          - dev
          - stable
      targets:
        description: Comma- or newline-separated build targets (defaults to every repeater target this branch defines)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: filter-build-${{ inputs.channel }}
  cancel-in-progress: false

jobs:

  version:
    name: Derive version, tag and gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      branch: ${{ steps.version.outputs.branch }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # empty branch input = the channel's own branch
          # the ref is an expression evaluated by Actions, never shell text
          ref: ${{ inputs.branch != '' && inputs.branch || (inputs.channel == 'stable' && 'repeater-filter-stable' || 'repeater-filter') }}
          fetch-depth: 0

      - name: Derive Version
        id: version
        uses: actions/github-script@v8
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_BUILD: ${{ inputs.force_build }}
          BRANCH_INPUT: ${{ inputs.branch }}
        with:
          script: |
            const { spawnSync } = require('child_process');
            const git = (...args) => {
              const r = spawnSync('git', args, { encoding: 'utf8' });
              if (r.status !== 0) throw new Error(`git ${args.join(' ')} failed: ${(r.stderr || '').trim()}`);
              return r.stdout;
            };
            const gitOk = (...args) => spawnSync('git', args, { encoding: 'utf8' }).status === 0;

            // sort -V equivalent for the version-suffix ordering of tag names
            const natCmp = (a, b) => {
              const pa = a.split(/(\d+)/), pb = b.split(/(\d+)/);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                if (pa[i] === undefined) return -1;
                if (pb[i] === undefined) return 1;
                const x = /^\d+$/.test(pa[i]) ? parseInt(pa[i], 10) : pa[i];
                const y = /^\d+$/.test(pb[i]) ? parseInt(pb[i], 10) : pb[i];
                if (x === y) continue;
                if (typeof x === 'number' && typeof y === 'number') return x - y;
                return String(x) < String(y) ? -1 : 1;
              }
              return 0;
            };

            const channel = process.env.CHANNEL;
            if (channel !== 'dev' && channel !== 'stable') {
              core.setFailed("channel must be 'dev' or 'stable'");
              return;
            }

            let branch = 'repeater-filter';
            let baseRef = 'origin/dev';
            if (channel === 'stable') {
              branch = 'repeater-filter-stable';
              baseRef = 'origin/main';
            }
            // via env, not an Actions expression: input text must never become
            // shell syntax
            if (process.env.BRANCH_INPUT) branch = process.env.BRANCH_INPUT;

            // upstream base: last companion-v* tag reachable from HEAD, X.Y.Z only
            // (companion-v1.17.1-25-g6df98abe -> v1.17.1)
            const desc = spawnSync('git', ['describe', '--tags', '--match', 'companion-v*', 'HEAD'],
              { encoding: 'utf8' });
            let upstreamVersion = 'untagged';
            if (desc.status === 0 && desc.stdout.trim()) {
              upstreamVersion = desc.stdout.trim().replace(/^companion-/, '').split('-')[0];
            }

            const tags = (pattern) => git('tag', '--list', pattern).split('\n').filter(Boolean);
            let releaseTag, displayVersion, releaseTitle, firmwareVersion, prevTag;
            if (channel === 'stable') {
              // previous stable tag = latest filter-v* tag under the new scheme
              // (no -dev suffix, no old date-scheme tags)
              prevTag = tags('filter-v*')
                .filter((t) => !t.includes('-dev.') && !/-20\d{6}-/.test(t))
                .sort(natCmp).pop() || '';
              // tag: filter-v<base>, or -rN when that base was already released
              let rnSuffix = '';
              if (gitOk('rev-parse', '-q', '--verify', `refs/tags/filter-${upstreamVersion}`)) {
                let n = 1;
                while (gitOk('rev-parse', '-q', '--verify', `refs/tags/filter-${upstreamVersion}-r${n}`)) n += 1;
                rnSuffix = `-r${n}`;
              }
              releaseTag = `filter-${upstreamVersion}${rnSuffix}`;
              displayVersion = `${upstreamVersion}${rnSuffix}`;
              releaseTitle = `Filter Firmware ${displayVersion} (stable)`;
              // build.sh appends -<short sha> itself
              firmwareVersion = `${upstreamVersion}-filter`;
            } else {
              // previous dev tag = latest filter-*-dev.* tag (new scheme only).
              // Scoped to the channel's own tags, so an unrelated stable release
              // cannot mask a dev change (or vice versa).
              prevTag = tags('filter-*-dev.*').sort(natCmp).pop() || '';
              // counter = highest existing suffix for this base + 1. Counting the
              // tags (count + 1) collides when one was deleted or a gap exists,
              // and a duplicate tag fails the release.
              const maxN = tags(`filter-${upstreamVersion}-dev.*`)
                .map((t) => { const m = t.match(/\.(\d+)$/); return m ? parseInt(m[1], 10) : 0; })
                .reduce((a, b) => Math.max(a, b), 0);
              const n = maxN + 1;
              releaseTag = `filter-${upstreamVersion}-dev.${n}`;
              displayVersion = `${upstreamVersion}-dev.${n}`;
              releaseTitle = `Filter Firmware ${displayVersion}`;
              // build.sh appends -<short sha> itself
              firmwareVersion = `${upstreamVersion}-dev.${n}-filter`;
            }

            // ---- gate: should this channel build at all? ----
            let skip = true;
            let range = 'HEAD';
            if (process.env.FORCE_BUILD === 'true') {
              skip = false;
              // forced builds still list changes since the previous release,
              // when there is one to compare against
              if (prevTag) range = `${prevTag}..HEAD`;
            } else if (!prevTag) {
              // first release of this channel under the new scheme
              range = 'HEAD';
            } else {
              // upstream base changed -> build to carry the new base
              const prevBase = (prevTag.match(/v\d+\.\d+\.\d+/) || [])[0] || '';
              if (prevBase && prevBase !== upstreamVersion) skip = false;
              range = `${prevTag}..HEAD`;
            }

            if (skip) {
              // build when any commit since the channel's last release touches
              // code (dev channel counts upstream commits too; stable excludes
              // upstream history so only cherry-picked filter commits count)
              // merges INCLUDED: a merge commit can carry a hand-resolved conflict,
              // which is a real code change that --no-merges would hide
              const revListArgs = ['rev-list', range];
              if (channel === 'stable') revListArgs.push('--not', baseRef);
              const commits = git(...revListArgs).split('\n').filter(Boolean);
              for (const c of commits) {
                const isCode = git('diff-tree', '--no-commit-id', '--name-only', '-r', c)
                  .split('\n').filter(Boolean)
                  .some((p) => {
                    if (p.endsWith('.md') || p.startsWith('docs/')) return false;  // docs only
                    if (p.startsWith('.github/actions/')) return true;             // build env = code
                    if (p.startsWith('.github/')) return false;                    // CI only
                    return true;
                  });
                if (isCode) {
                  skip = false;
                  break;
                }
              }
            }

            core.setOutput('skip', String(skip));
            core.setOutput('branch', branch);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('release_title', releaseTitle);
            core.setOutput('firmware_version', firmwareVersion);
            // the exact revision everything below was derived from and built at
            core.setOutput('source_sha', git('rev-parse', 'HEAD').trim());

  validate-targets:
    name: Validate build targets
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.validate.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # the revision the release names, not the branch tip: the target list
          # must describe the same tree the firmware is built from
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Validate Build Targets
        id: validate
        uses: actions/github-script@v8
        env:
          TARGETS_INPUT: ${{ inputs.targets }}
        with:
          script: |
            const { execFileSync } = require('child_process');

            // known targets come from platformio.ini via build.sh
            // build.sh uses bash arrays; /bin/sh is not a contract
            const known = execFileSync('bash', ['build.sh', 'list'], { encoding: 'utf8' })
              .split(/\r?\n/).map((s) => s.trim()).filter(Boolean);

            // explicit input wins (via env: an input containing a quote must
            // stay data); otherwise every repeater firmware this branch defines
            const input = (process.env.TARGETS_INPUT || '').trim();
            const selected = new Set();
            if (input) {
              for (const target of input.split(/[\s,]+/).filter(Boolean)) {
                if (known.includes(target)) {
                  selected.add(target);
                } else {
                  // warn and skip unknown names instead of failing: a target can
                  // be valid on the dev branch but not yet on stable's upstream base
                  core.warning(`unknown build target '${target}' - skipped (not in this branch's platformio.ini)`);
                }
              }
            } else {
              for (const target of known) {
                if (/repeater/i.test(target)) selected.add(target);
              }
            }
            if (selected.size === 0) {
              core.setFailed("No known build targets: pass the 'targets' input, or this branch defines no repeater firmware");
              return;
            }

            core.setOutput('targets', JSON.stringify([...selected]));

  build:
    name: Build ${{ matrix.target }}
    needs: [version, validate-targets]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Dev publishes what built; a board that failed is visible as a red matrix
    # job in the run. Stable does NOT skip failures: a stable release is
    # what users install, so any requested board failing must block it.
    continue-on-error: ${{ inputs.channel != 'stable' }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.validate-targets.outputs.targets) }}
      fail-fast: false
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # pinned, like the target list: if the branch moved after version
          # selection, the release body and the tag would all name
          # a revision this job never built
          ref: ${{ needs.version.outputs.source_sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        uses: actions/github-script@v8
        env:
          FIRMWARE_VERSION: ${{ needs.version.outputs.firmware_version }}
          TARGET: ${{ matrix.target }}
          # metadata-only (emits .su files next to the objects; codegen is
          # unchanged) — consumed by the stack usage check below
          PLATFORMIO_BUILD_FLAGS: -fstack-usage
        with:
          script: |
            const { spawnSync } = require('child_process');
            const target = process.env.TARGET;
            const r = spawnSync('bash', ['build.sh', 'build-firmware', target], { stdio: 'inherit' });
            if (r.error) throw r.error;
            if (r.status !== 0) throw new Error(`build.sh build-firmware ${target} exited with status ${r.status}`);

      - name: Stack usage check
        # One big stack scratch array in boot- or loop-path code brick-reboots
        # every repeater flashed with the release (2026-10: an 8.5 KB scratch
        # in FilterRules::load overflowed the 4 KB nRF52 / 8 KB ESP32 loop
        # task stacks at boot). The compiler's own accounting catches that
        # class on every target we publish; the binary is unaffected.
        uses: actions/github-script@v8
        env:
          TARGET: ${{ matrix.target }}
          STACK_FRAME_LIMIT: 2048
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const limit = parseInt(process.env.STACK_FRAME_LIMIT, 10);
            const suDir = path.join('.pio', 'build', process.env.TARGET);

            // repo code only: src/ and examples/. Vendored crypto (lib/ed25519) and
            // libdeps libraries carry frames above the limit that ship today and are
            // not what this repo edits; gating them would train everyone to ignore
            // the check. The frames this repo owns are the ones it can break.
            const suFiles = [];
            const walk = (dir) => {
              if (!fs.existsSync(dir)) return;
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(p);
                else if (p.endsWith('.su')) suFiles.push(p);
              }
            };
            walk(path.join(suDir, 'src'));
            walk(path.join(suDir, 'examples'));

            if (suFiles.length === 0) {
              core.setFailed(`ERROR: no .su files under ${suDir} — the build did not run with -fstack-usage, check is blind`);
              return;
            }
            // .su lines are "file:line:col:function\tbytes\ttype"
            const offenders = [];
            for (const f of suFiles) {
              for (const line of fs.readFileSync(f, 'utf8').split('\n')) {
                if (!line.trim()) continue;
                const [loc, size] = line.split('\t');
                if (parseInt(size, 10) >= limit) offenders.push(`${size} B  ${loc}`);
              }
            }
            if (offenders.length > 0) {
              core.setFailed(`ERROR: stack frames >= ${limit} B (loop task is 4 KB on nRF52, 8 KB on ESP32):\n${offenders.join('\n')}`);
              return;
            }
            core.info(`OK: ${suFiles.length} translation units, no stack frame >= ${limit} B`);

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          # channel prefix keeps the two concurrently-built channels' artifacts
          # from colliding in the shared artifact store
          name: "firmware-${{ inputs.channel }}-${{ matrix.target }}"
          path: out
          if-no-files-found: error

  release:
    name: Create Release
    # validate-targets rides in through build's own needs; a skipped build
    # (nothing to release) skips this job the same way
    needs: [version, build]
    if: inputs.create_release
    runs-on: ubuntu-latest
    # only this job writes; build and test jobs stay at contents: read
    permissions:
      contents: write
    steps:

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "firmware-${{ inputs.channel }}-*"
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_title }}
          # dev releases are pre-releases; the stable release is the repo's latest
          prerelease: ${{ inputs.channel != 'stable' }}
          make_latest: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
          # release notes are written by hand after the release is created
          body: "Built from commit `${{ needs.version.outputs.source_sha }}`."
          files: out/*
          target_commitish: ${{ needs.version.outputs.source_sha }}
