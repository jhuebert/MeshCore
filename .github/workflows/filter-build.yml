name: Filter Firmware Build

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: string
        default: dev
      targets:
        description: Comma- or newline-separated build targets (defaults to the FIRMWARE_TARGETS repo variable)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (dev = repeater-filter, stable = repeater-filter-stable)
        required: false
        type: choice
        default: dev
        options:
          - dev
          - stable
      targets:
        description: Comma- or newline-separated build targets (defaults to the FIRMWARE_TARGETS repo variable)
        required: false
        type: string
        default: ""
      branch:
        description: Branch to build (defaults to the channel's branch)
        required: false
        type: string
        default: ""
      create_release:
        description: Attach the built firmware to a release
        required: false
        type: boolean
        default: true
      force_build:
        description: Build even if nothing changed since the last release of this channel
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: filter-build-${{ inputs.channel }}
  cancel-in-progress: false

jobs:

  version:
    name: Derive version, tag and gate
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      branch: ${{ steps.version.outputs.branch }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      base_line: ${{ steps.version.outputs.base_line }}
      changes_section: ${{ steps.version.outputs.changes_section }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          # empty branch input = the channel's own branch
          ref: ${{ inputs.branch != '' && inputs.branch || (inputs.channel == 'stable' && 'repeater-filter-stable' || 'repeater-filter') }}
          fetch-depth: 0

      - name: Derive Version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            dev|stable) ;;
            *) echo "channel must be 'dev' or 'stable'" >&2; exit 1 ;;
          esac

          if [ "$CHANNEL" = stable ]; then
            BRANCH="repeater-filter-stable"
            BASE_REF="origin/main"
          else
            BRANCH="repeater-filter"
            BASE_REF="origin/dev"
          fi
          [ -n "${{ inputs.branch }}" ] && BRANCH="${{ inputs.branch }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # upstream base: last companion-v* tag reachable from HEAD, X.Y.Z only
          # (companion-v1.17.1-25-g6df98abe -> v1.17.1)
          DESC=$(git describe --tags --match 'companion-v*' HEAD 2>/dev/null || true)
          if [ -n "$DESC" ]; then
            UPSTREAM_VERSION="${DESC#companion-}"
            UPSTREAM_VERSION="${UPSTREAM_VERSION%%-*}"
          else
            UPSTREAM_VERSION="untagged"
          fi

          if [ "$CHANNEL" = stable ]; then
            # previous stable tag = latest filter-v* tag under the new scheme
            # (no -dev suffix, no old date-scheme tags)
            PREV_TAG=$(git tag --list 'filter-v*' \
              | grep -v -- '-dev\.' | grep -vE -- '-20[0-9]{6}-' \
              | sort -V | tail -1 || true)
            # tag: filter-v<base>, or -rN when that base was already released
            RN_SUFFIX=""
            if git rev-parse -q --verify "refs/tags/filter-${UPSTREAM_VERSION}" >/dev/null; then
              N=1
              while git rev-parse -q --verify "refs/tags/filter-${UPSTREAM_VERSION}-r${N}" >/dev/null; do
                N=$((N + 1))
              done
              RN_SUFFIX="-r${N}"
            fi
            RELEASE_TAG="filter-${UPSTREAM_VERSION}${RN_SUFFIX}"
            DISPLAY_VERSION="${UPSTREAM_VERSION}${RN_SUFFIX}"
            RELEASE_TITLE="Filter Firmware ${DISPLAY_VERSION} (stable)"
            FIRMWARE_VERSION="${UPSTREAM_VERSION}-filter-${SHORT_SHA}"
          else
            # previous dev tag = latest filter-*-dev.* tag (new scheme only)
            PREV_TAG=$(git tag --list 'filter-*-dev.*' | sort -V | tail -1 || true)
            # counter = existing tags for this base + 1 (resets on new base)
            N=$(( $(git tag --list "filter-${UPSTREAM_VERSION}-dev.*" | wc -l) + 1 ))
            RELEASE_TAG="filter-${UPSTREAM_VERSION}-dev.${N}"
            DISPLAY_VERSION="${UPSTREAM_VERSION}-dev.${N}"
            RELEASE_TITLE="Filter Firmware ${DISPLAY_VERSION}"
            FIRMWARE_VERSION="${UPSTREAM_VERSION}-dev.${N}-filter-${SHORT_SHA}"
          fi

          # upstream base link for the release body
          if [ "$UPSTREAM_VERSION" = untagged ]; then
            BASE_LINE="untagged"
          else
            BASE_LINE="[${UPSTREAM_VERSION}](https://github.com/meshcore-dev/MeshCore/releases/tag/repeater-${UPSTREAM_VERSION})"
          fi

          # ---- gate: should this channel build at all? ----
          SKIP=true
          RANGE="HEAD"
          if [ "$FORCE_BUILD" = true ]; then
            SKIP=false
          elif [ -z "$PREV_TAG" ]; then
            # first release of this channel under the new scheme
            SKIP=false
            RANGE="HEAD"
          else
            # upstream base changed -> build to carry the new base
            PREV_BASE=$(echo "$PREV_TAG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -n "$PREV_BASE" ] && [ "$PREV_BASE" != "$UPSTREAM_VERSION" ]; then
              SKIP=false
            fi
            RANGE="${PREV_TAG}..HEAD"
          fi

          if [ "$SKIP" = true ]; then
            # build when any commit since the channel's last release touches
            # code (dev channel counts upstream commits too; stable excludes
            # upstream history so only cherry-picked filter commits count)
            if [ "$CHANNEL" = stable ]; then
              COMMITS=$(git rev-list "$RANGE" --no-merges --not "$BASE_REF")
            else
              COMMITS=$(git rev-list "$RANGE" --no-merges)
            fi
            for c in $COMMITS; do
              CODE=0
              while IFS= read -r p; do
                case "$p" in
                  *.md|docs/*) ;;                       # docs only
                  .github/actions/*) CODE=1; break ;;   # build env = code
                  .github/*) ;;                         # CI only
                  *) CODE=1; break ;;
                esac
              done < <(git diff-tree --no-commit-id --name-only -r "$c")
              if [ "$CODE" = 1 ]; then
                SKIP=false
                break
              fi
            done
          fi

          # ---- curated "Filter changes in this build" section ----
          # filter-only commits since the previous release of this channel
          # (--not <upstream base> subtracts everything reachable from upstream)
          CHANGES_FILE=$(mktemp)
          for c in $(git rev-list "$RANGE" --no-merges --not "$BASE_REF"); do
            SUBJECT=$(git log -1 --format=%s "$c")
            DOCS_ONLY=1
            while IFS= read -r p; do
              case "$p" in
                *.md|docs/*|.github/*) ;;
                *) DOCS_ONLY=0; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$c")
            if [ "$DOCS_ONLY" = 1 ]; then
              echo "- $SUBJECT" >> "${CHANGES_FILE}.extra"
            else
              case "$SUBJECT" in
                test:*|test\(*) echo "- $SUBJECT" >> "${CHANGES_FILE}.extra" ;;
                *) echo "- $SUBJECT" >> "${CHANGES_FILE}.main" ;;
              esac
            fi
          done

          if [ -s "${CHANGES_FILE}.main" ] || [ -s "${CHANGES_FILE}.extra" ]; then
            {
              echo "## Filter changes in this build"
              echo
              cat "${CHANGES_FILE}.main" 2>/dev/null || true
              if [ -s "${CHANGES_FILE}.extra" ]; then
                echo "<details><summary>Tests, docs & CI</summary>"
                echo
                cat "${CHANGES_FILE}.extra"
                echo
                echo "</details>"
              fi
            } > "$CHANGES_FILE"
          else
            : > "$CHANGES_FILE"
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "firmware_version=$FIRMWARE_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_line=$BASE_LINE" >> "$GITHUB_OUTPUT"
          {
            echo "changes_section<<CHANGES_EOF"
            cat "$CHANGES_FILE"
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"

  validate-targets:
    name: Validate build targets
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.validate.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.branch }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Validate Build Targets
        id: validate
        env:
          TARGETS_INPUT: ${{ inputs.targets }}
        run: |
          # resolve targets: explicit input, else FIRMWARE_TARGETS repo variable
          TARGETS="${TARGETS_INPUT:-${{ vars.FIRMWARE_TARGETS }}}"
          if [ -z "$TARGETS" ]; then
            echo "No targets: set the FIRMWARE_TARGETS repo variable or pass the 'targets' input" >&2
            exit 1
          fi

          # known targets come from platformio.ini via build.sh
          sh build.sh list > /tmp/known-targets.txt

          # fail hard on unknown names instead of silently skipping them
          for target in $(echo "$TARGETS" | tr ' ,' '\n'); do
            [ -z "$target" ] && continue
            if ! grep -qx "$target" /tmp/known-targets.txt; then
              echo "Unknown build target: '$target'" >&2
              exit 1
            fi
          done

          # convert targets separated by comma/newline into a json array string
          JSON_ARRAY=$(echo "$TARGETS" | tr ' ,' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: [version, validate-targets]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.validate-targets.outputs.targets) }}
      fail-fast: false
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.branch }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ needs.version.outputs.firmware_version }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          # channel prefix keeps the two concurrently-built channels' artifacts
          # from colliding in the shared artifact store
          name: "firmware-${{ inputs.channel }}-${{ matrix.target }}"
          path: out

  release:
    name: Create Release
    needs: [version, validate-targets, build]
    if: inputs.create_release && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "firmware-${{ inputs.channel }}-*"
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_title }}
          # dev releases are pre-releases; the stable release is the repo's latest
          prerelease: ${{ inputs.channel != 'stable' }}
          make_latest: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
          generate_release_notes: true
          body: |
            Built from `${{ needs.version.outputs.branch }}` @ ${{ needs.version.outputs.short_sha }}.

            Upstream base: ${{ needs.version.outputs.base_line }} (meshcore-dev/MeshCore).
            Targets: ${{ join(fromJSON(needs.validate-targets.outputs.targets), ', ') }}

            ${{ needs.version.outputs.changes_section }}
          files: out/*
          target_commitish: ${{ needs.version.outputs.branch }}
