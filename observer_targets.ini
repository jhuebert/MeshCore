; Optional MQTT observer firmware environments. Keep the target catalog here so
; build.sh and release tooling can discover it from PlatformIO's resolved config.
[observer]
; PsychicMqttClient and the Arduino ESP32 cert-bundle adapter need these
; framework headers in addition to the default IDF include directories.
build_flags = -D WITH_MQTT_OBSERVER=1
  -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
build_src_filter = +<../examples/mqtt_observer/*.cpp>
lib_deps =
  https://github.com/theelims/PsychicMqttClient.git#9e3005571918fdd83a2521243c501d1af137b0b6

; Repeater-only targets for the supported Observer hardware list.
[env:Heltec_T190_repeater_observer]
extends = env:Heltec_T190_repeater_
build_flags =
  ${env:Heltec_T190_repeater_.build_flags}
  ${observer.build_flags}
build_src_filter =
  ${env:Heltec_T190_repeater_.build_src_filter}
  ${observer.build_src_filter}
lib_deps =
  ${env:Heltec_T190_repeater_.lib_deps}
  ${observer.lib_deps}

